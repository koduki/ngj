name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# =============================================================================
# Valhalla JDK Configuration
# =============================================================================
# NGJ targets JDK 28 Early-Access with JEP 401 (Value Objects) preview feature.
# Pinned build: JDK 28 EA Build 24 (2026-11-12)
# Download: https://jdk.java.net/28/
#
# JEP 401 provides:
# - Value classes declared with the `value` modifier  
# - Value objects that are immutable and lack object identity
# - `==` operator compares value objects by field values
# - Sealed hierarchies with PermittedSubclasses attribute
# =============================================================================

env:
  VALHALLA_JDK_VERSION: "28"
  VALHALLA_JDK_BUILD: "24"
  VALHALLA_JDK_URL: "https://download.java.net/java/early_access/jdk28/24/GPL/openjdk-28-ea+24_linux-x64_bin.tar.gz"
  JAVA_HOME_28: "/opt/jdk-28"

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download and install JDK 28 EA Build 24 (Valhalla)
      run: |
        echo "Downloading JDK 28 EA Build 24 with JEP 401 Value Objects..."
        curl -sSL -o /tmp/jdk28.tar.gz "$VALHALLA_JDK_URL"
        sudo mkdir -p /opt/jdk-28
        sudo tar -xzf /tmp/jdk28.tar.gz -C /opt/jdk-28 --strip-components=1
        echo "JAVA_HOME=/opt/jdk-28" >> $GITHUB_ENV
        echo "/opt/jdk-28/bin" >> $GITHUB_PATH
        
    - name: Verify JDK version and preview features
      run: |
        java --version
        echo "Verifying JEP 401 Value Objects support..."
        # Verify --enable-preview flag is accepted (JDK 28 EA with JEP 401)
        java --enable-preview -version
        echo "Preview features enabled successfully"
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build with preview features
      run: ./gradlew build
    
    - name: Run tests with preview features
      run: ./gradlew test
    
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: compiler/build/reports/tests/

  integration-test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download and install JDK 28 EA Build 24 (Valhalla)
      run: |
        curl -sSL -o /tmp/jdk28.tar.gz "$VALHALLA_JDK_URL"
        sudo mkdir -p /opt/jdk-28
        sudo tar -xzf /tmp/jdk28.tar.gz -C /opt/jdk-28 --strip-components=1
        echo "JAVA_HOME=/opt/jdk-28" >> $GITHUB_ENV
        echo "/opt/jdk-28/bin" >> $GITHUB_PATH
    
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build compiler JAR
      run: ./gradlew fatJar
    
    - name: Run fixture tests with preview features
      run: |
        java --enable-preview -jar compiler/build/libs/compiler-*-all.jar --version || true
        
    - name: Verify Valhalla value class output
      run: |
        echo "Testing value class generation..."
        java --enable-preview -jar compiler/build/libs/compiler-*-all.jar check fixtures/positive/simple_function.ngj || true

  container-build:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build runtime image
      uses: docker/build-push-action@v5
      with:
        context: .
        target: runtime
        push: false
        tags: ngj:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Test container with preview features
      run: |
        docker build --target runtime -t ngj:test .
        docker run --rm ngj:test --version
        docker run --rm ngj:test --help
